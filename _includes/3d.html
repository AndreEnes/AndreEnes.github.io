<div id="canvas-container" style="width: 100%; height: 400px; background-color: #ffffff; margin: 20px 0; border-radius: 8px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
  const container = document.getElementById('canvas-container');

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  
  const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const geometry = new THREE.ConeGeometry(1.2, 3, 30);
  
  const material = new THREE.MeshStandardMaterial({
    color: 0x00ff88,
    roughness: 1,
    metalness: 0.8
  });
  
  const customShape = new THREE.Mesh(geometry, material);
  scene.add(customShape);
  
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  
  const pointLight = new THREE.PointLight(0xffffff, 1);
  pointLight.position.set(5, 5, 5);
  scene.add(pointLight);

  camera.position.z = 3;

  function animate() {
    requestAnimationFrame(animate);

    customShape.rotation.x += 0.05;
    customShape.rotation.y += 0.06;
    customShape.rotation.z += 0.01;

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    const width = container.clientWidth;
    const height = container.clientHeight;
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  });

  animate();
</script>
