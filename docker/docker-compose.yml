services:
  jekyll:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "4000:4000"
      - "35729:35729"   # LiveReload port
    volumes:
      - ..:/site
      - bundle_cache:/usr/local/bundle   # Cache gems between runs
    environment:
      - JEKYLL_ENV=development

volumes:
  bundle_cache:
